<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sire's Monthly & Weekly Task Register</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        glass: {
                            bg: 'rgba(15, 23, 42, 0.75)',
                            card: 'rgba(30, 41, 59, 0.5)',
                            border: 'rgba(255, 255, 255, 0.08)',
                            hover: 'rgba(51, 65, 85, 0.6)'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top left, #0f172a, #020617);
            min-height: 100vh;
            color: #f8fafc;
        }

        /* Glassmorphism effects */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Custom Task Card States & Transitions */
        .task-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Done state: Vibrant Green (No Strike-through) */
        .task-card.task-done {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.35);
            box-shadow: 0 4px 20px -2px rgba(16, 185, 129, 0.15);
        }
        .task-card.task-done:hover {
            background: rgba(16, 185, 129, 0.18);
            border-color: rgba(16, 185, 129, 0.5);
        }

        /* Not Done state: Red subtle theme */
        .task-card.task-pending {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.25);
            box-shadow: 0 4px 15px -2px rgba(239, 68, 68, 0.08);
        }
        .task-card.task-pending:hover {
            background: rgba(239, 68, 68, 0.13);
            border-color: rgba(239, 68, 68, 0.4);
        }

        /* Crossed-Out / Canceled / Voided State */
        .task-card.task-crossed {
            background: rgba(51, 65, 85, 0.25);
            border: 1px dashed rgba(148, 163, 184, 0.3);
            opacity: 0.65;
        }
        .task-card.task-crossed:hover {
            background: rgba(51, 65, 85, 0.35);
            opacity: 0.85;
        }

        /* Checkbox styling */
        .custom-checkbox {
            transition: all 0.2s ease;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.8);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(71, 85, 105, 1);
        }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen text-slate-100 selection:bg-emerald-500 selection:text-white">

    <!-- App Container -->
    <div class="flex-1 flex flex-col lg:flex-row max-w-[1600px] w-full mx-auto p-3 sm:p-6 gap-6">

        <!-- Sidebar Navigation (Months) -->
        <aside class="w-full lg:w-80 flex flex-col glass-panel rounded-3xl p-5 shadow-2xl relative z-10 shrink-0">
            <!-- Sidebar Header -->
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
                <div class="flex items-center gap-3">
                    <div class="p-2.5 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 text-slate-950 font-black shadow-lg shadow-emerald-500/20">
                        <i data-lucide="calendar-check-2" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg leading-tight tracking-tight text-white">TaskRegister</h1>
                        <p class="text-xs text-slate-400 font-medium">Monthly & Weekly Planner</p>
                    </div>
                </div>
            </div>

            <!-- New Month Action Button -->
            <button onclick="openAddMonthModal()" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold text-sm shadow-lg shadow-emerald-500/20 hover:shadow-emerald-500/30 transition-all duration-200 flex items-center justify-center gap-2 group mb-5">
                <i data-lucide="plus" class="w-4 h-4 stroke-[3] group-hover:scale-110 transition-transform"></i>
                <span>Register New Month</span>
            </button>

            <!-- Month Search & Filter -->
            <div class="relative mb-3">
                <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="monthSearch" placeholder="Search months..." oninput="renderMonthsList()" class="w-full pl-10 pr-4 py-2 rounded-xl bg-slate-900/60 border border-slate-800 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500/50 transition">
            </div>

            <!-- Registered Months List -->
            <div class="flex-1 overflow-y-auto pr-1 space-y-2 max-h-[320px] lg:max-h-none" id="monthsList">
                <!-- Dynamically populated -->
            </div>

            <!-- Footer Stats Quick View -->
            <div class="mt-auto pt-4 border-t border-slate-800/80 text-xs text-slate-400 flex justify-between items-center">
                <span id="totalMonthsCount">0 Registered Months</span>
                <button onclick="resetToDefaultData()" class="text-slate-500 hover:text-amber-400 transition flex items-center gap-1" title="Reset to Sample Data">
                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Reset
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col glass-panel rounded-3xl p-4 sm:p-8 shadow-2xl relative overflow-hidden">
            
            <!-- Empty State Display (if no months registered) -->
            <div id="emptyState" class="hidden flex-1 flex flex-col items-center justify-center text-center p-8">
                <div class="w-20 h-20 rounded-3xl bg-slate-800/50 flex items-center justify-center text-slate-500 mb-4 border border-slate-700/50">
                    <i data-lucide="calendar-plus" class="w-10 h-10"></i>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2">No Month Selected</h2>
                <p class="text-slate-400 max-w-md text-sm mb-6">Register a new month or select an existing one from the sidebar to view and manage your weekly task checklist.</p>
                <button onclick="openAddMonthModal()" class="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm transition shadow-lg shadow-emerald-500/20">
                    Register Month Now
                </button>
            </div>

            <!-- Active Month Dashboard Content -->
            <div id="monthContent" class="flex-1 flex flex-col">
                
                <!-- Header: Active Month Title & Overall Progress -->
                <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 pb-6 border-b border-slate-800">
                    <div>
                        <div class="flex items-center gap-3 mb-1">
                            <h2 id="activeMonthTitle" class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">--</h2>
                            <button onclick="openEditMonthModal()" class="text-slate-400 hover:text-emerald-400 transition p-1.5 rounded-lg hover:bg-slate-800/60" title="Edit Month Title">
                                <i data-lucide="edit-3" class="w-4 h-4"></i>
                            </button>
                        </div>
                        <p id="activeMonthSubtitle" class="text-xs sm:text-sm text-slate-400">4 Weeks Breakdown Checklist</p>
                    </div>

                    <!-- Main Progress Widget -->
                    <div class="glass-card rounded-2xl p-4 sm:px-6 sm:py-3 flex items-center gap-5 border border-slate-700/40 min-w-[280px]">
                        <div class="flex-1">
                            <div class="flex justify-between items-center text-xs font-semibold mb-1.5">
                                <span class="text-slate-300">Monthly Completion</span>
                                <span id="monthlyPercent" class="text-emerald-400 font-bold text-sm">0%</span>
                            </div>
                            <!-- Progress Bar -->
                            <div class="w-full bg-slate-900 rounded-full h-2.5 overflow-hidden border border-slate-800">
                                <div id="monthlyProgressBar" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-2.5 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                            </div>
                            <div class="flex justify-between text-[11px] text-slate-400 mt-1">
                                <span id="monthlyDoneCount">0 done</span>
                                <span id="monthlyPendingCount">0 pending</span>
                            </div>
                        </div>
                        <div class="p-3 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 hidden sm:block">
                            <i data-lucide="trophy" class="w-6 h-6"></i>
                        </div>
                    </div>
                </header>

                <!-- Navigation Tabs for Weeks & View Modes -->
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <!-- Week Selection Tabs -->
                    <div class="flex items-center gap-1.5 p-1.5 rounded-2xl bg-slate-900/80 border border-slate-800 overflow-x-auto max-w-full">
                        <button onclick="setActiveWeekTab('all')" id="tab-all" class="week-tab px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition whitespace-nowrap text-slate-400 hover:text-white">
                            All Weeks
                        </button>
                        <button onclick="setActiveWeekTab(1)" id="tab-1" class="week-tab px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition whitespace-nowrap text-slate-400 hover:text-white">
                            Week 1
                        </button>
                        <button onclick="setActiveWeekTab(2)" id="tab-2" class="week-tab px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition whitespace-nowrap text-slate-400 hover:text-white">
                            Week 2
                        </button>
                        <button onclick="setActiveWeekTab(3)" id="tab-3" class="week-tab px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition whitespace-nowrap text-slate-400 hover:text-white">
                            Week 3
                        </button>
                        <button onclick="setActiveWeekTab(4)" id="tab-4" class="week-tab px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition whitespace-nowrap text-slate-400 hover:text-white">
                            Week 4
                        </button>
                    </div>

                    <!-- Quick Add Task Button -->
                    <button onclick="openAddTaskModal()" class="py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-medium text-xs sm:text-sm border border-slate-700 transition flex items-center justify-center gap-2 shadow-md">
                        <i data-lucide="plus-circle" class="w-4 h-4 text-emerald-400"></i>
                        <span>Add Task</span>
                    </button>
                </div>

                <!-- Weeks Grid / List Section -->
                <div id="weeksContainer" class="flex-1 overflow-y-auto pr-1 space-y-6">
                    <!-- Dynamic Week Sections generated here -->
                </div>

            </div>

        </main>
    </div>

    <!-- MODAL 1: Register / Edit Month Modal -->
    <div id="monthModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="glass-panel max-w-md w-full rounded-3xl p-6 sm:p-8 border border-slate-700/60 shadow-2xl scale-95 transition-transform duration-200 id-modal-box">
            <div class="flex justify-between items-center mb-5">
                <h3 id="monthModalTitle" class="text-xl font-bold text-white">Register New Month</h3>
                <button onclick="closeMonthModal()" class="text-slate-400 hover:text-white p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <form onsubmit="handleSaveMonth(event)" class="space-y-4">
                <input type="hidden" id="editMonthId" value="">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Month & Year Title</label>
                    <input type="text" id="monthNameInput" required placeholder="e.g. October 2026 or March" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Preset Template Options</label>
                    <select id="monthTemplateSelect" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-slate-200 text-sm focus:outline-none focus:border-emerald-500 transition">
                        <option value="empty">Empty Weeks (Start Fresh)</option>
                        <option value="sample">Fill with Starter Tasks</option>
                    </select>
                </div>

                <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-800">
                    <button type="button" onclick="closeMonthModal()" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-sm transition">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm transition shadow-lg shadow-emerald-500/20">Save Month</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL 2: Add / Edit Task Modal -->
    <div id="taskModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="glass-panel max-w-md w-full rounded-3xl p-6 sm:p-8 border border-slate-700/60 shadow-2xl scale-95 transition-transform duration-200 id-modal-box">
            <div class="flex justify-between items-center mb-5">
                <h3 id="taskModalTitle" class="text-xl font-bold text-white">Add New Task</h3>
                <button onclick="closeTaskModal()" class="text-slate-400 hover:text-white p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <form onsubmit="handleSaveTask(event)" class="space-y-4">
                <input type="hidden" id="editTaskId" value="">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Task Description</label>
                    <input type="text" id="taskTitleInput" required placeholder="e.g. Review Q3 budget reports" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Assign to Week</label>
                    <select id="taskWeekSelect" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-slate-200 text-sm focus:outline-none focus:border-emerald-500 transition">
                        <option value="1">Week 1</option>
                        <option value="2">Week 2</option>
                        <option value="3">Week 3</option>
                        <option value="4">Week 4</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Initial Status</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="flex items-center gap-2 p-3 rounded-xl bg-slate-900/80 border border-slate-800 cursor-pointer hover:border-emerald-500/50 transition">
                            <input type="radio" name="taskStatusRadio" value="false" checked class="accent-emerald-500">
                            <span class="text-xs font-semibold text-red-400 flex items-center gap-1.5"><i data-lucide="square" class="w-3.5 h-3.5"></i> Not Done</span>
                        </label>
                        <label class="flex items-center gap-2 p-3 rounded-xl bg-slate-900/80 border border-slate-800 cursor-pointer hover:border-emerald-500/50 transition">
                            <input type="radio" name="taskStatusRadio" value="true" class="accent-emerald-500">
                            <span class="text-xs font-semibold text-emerald-400 flex items-center gap-1.5"><i data-lucide="check-square" class="w-3.5 h-3.5"></i> Done</span>
                        </label>
                    </div>
                </div>

                <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-800">
                    <button type="button" onclick="closeTaskModal()" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-sm transition">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm transition shadow-lg shadow-emerald-500/20">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        const STORAGE_KEY = 'task_register_app_data_v3';

        let appData = {
            activeMonthId: null,
            months: []
        };

        let currentTabFilter = 'all'; // 'all', 1, 2, 3, 4

        function getDefaultStarterData() {
            return {
                activeMonthId: 'm-2026-10',
                months: [
                    {
                        id: 'm-2026-10',
                        name: 'October 2026',
                        weeks: {
                            1: [
                                { id: 't-101', title: 'Plan monthly objectives & strategy', done: true, crossed: false },
                                { id: 't-102', title: 'Team alignment meeting & task distribution', done: true, crossed: false },
                                { id: 't-103', title: 'Review initial design wireframes', done: false, crossed: false }
                            ],
                            2: [
                                { id: 't-201', title: 'Mid-month performance metric review', done: true, crossed: false },
                                { id: 't-202', title: 'Update project documentation and timelines', done: false, crossed: false },
                                { id: 't-203', title: 'Obsolete feedback session', done: false, crossed: true }
                            ],
                            3: [
                                { id: 't-301', title: 'Conduct code audit and security check', done: false, crossed: false },
                                { id: 't-302', title: 'Prepare preliminary Q4 report draft', done: false, crossed: false }
                            ],
                            4: [
                                { id: 't-401', title: 'Finalize month-end financial audits', done: false, crossed: false },
                                { id: 't-402', title: 'Set goals and register tasks for November', done: false, crossed: false }
                            ]
                        }
                    },
                    {
                        id: 'm-2026-11',
                        name: 'November 2026',
                        weeks: {
                            1: [
                                { id: 't-501', title: 'Kickoff Q4 primary sprint', done: true, crossed: false },
                                { id: 't-502', title: 'Review vendor contracts', done: false, crossed: false }
                            ],
                            2: [
                                { id: 't-601', title: 'Systems integration testing', done: false, crossed: false }
                            ],
                            3: [],
                            4: []
                        }
                    }
                ]
            };
        }

        function initApp() {
            loadFromStorage();
            renderMonthsList();
            renderActiveMonth();
        }

        function saveToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        }

        function loadFromStorage() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                try {
                    appData = JSON.parse(raw);
                } catch (e) {
                    appData = getDefaultStarterData();
                    saveToStorage();
                }
            } else {
                appData = getDefaultStarterData();
                saveToStorage();
            }
        }

        function resetToDefaultData() {
            if (confirm("Reset all task register data to initial sample months?")) {
                appData = getDefaultStarterData();
                saveToStorage();
                currentTabFilter = 'all';
                renderMonthsList();
                renderActiveMonth();
            }
        }

        function renderMonthsList() {
            const listEl = document.getElementById('monthsList');
            const searchInput = document.getElementById('monthSearch');
            const searchVal = searchInput ? (searchInput.value || '').toLowerCase() : '';
            listEl.innerHTML = '';

            const filteredMonths = appData.months.filter(m => m.name.toLowerCase().includes(searchVal));

            document.getElementById('totalMonthsCount').innerText = `${appData.months.length} Registered Month${appData.months.length === 1 ? '' : 's'}`;

            if (filteredMonths.length === 0) {
                listEl.innerHTML = `
                    <div class="p-4 text-center text-xs text-slate-500 rounded-2xl bg-slate-900/30">
                        No matching months found
                    </div>
                `;
                return;
            }

            filteredMonths.forEach(m => {
                const isActive = m.id === appData.activeMonthId;
                
                let total = 0;
                let done = 0;
                [1, 2, 3, 4].forEach(w => {
                    if (m.weeks && m.weeks[w]) {
                        const activeTasks = m.weeks[w].filter(t => !t.crossed);
                        total += activeTasks.length;
                        done += activeTasks.filter(t => t.done).length;
                    }
                });
                const pct = total > 0 ? Math.round((done / total) * 100) : 0;

                const monthItem = document.createElement('div');
                monthItem.className = `group flex items-center justify-between p-3 rounded-2xl cursor-pointer transition-all duration-200 border ${
                    isActive 
                    ? 'bg-slate-800/90 border-emerald-500/40 shadow-lg shadow-emerald-500/5 text-white' 
                    : 'bg-slate-900/40 border-slate-800/80 text-slate-400 hover:bg-slate-800/40 hover:text-slate-200'
                }`;

                monthItem.onclick = () => selectMonth(m.id);

                monthItem.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="w-2 h-2 rounded-full ${isActive ? 'bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.8)]' : 'bg-slate-700'}"></div>
                        <span class="font-semibold text-xs sm:text-sm truncate">${escapeHtml(m.name)}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-[11px] font-bold px-2 py-0.5 rounded-lg ${
                            pct === 100 && total > 0 
                            ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' 
                            : 'bg-slate-800 text-slate-400'
                        }">${pct}%</span>
                    </div>
                `;
                listEl.appendChild(monthItem);
            });

            if (window.lucide) lucide.createIcons();
        }

        function selectMonth(monthId) {
            appData.activeMonthId = monthId;
            saveToStorage();
            renderMonthsList();
            renderActiveMonth();
        }

        function renderActiveMonth() {
            const emptyState = document.getElementById('emptyState');
            const monthContent = document.getElementById('monthContent');

            const activeMonth = appData.months.find(m => m.id === appData.activeMonthId);

            if (!activeMonth) {
                emptyState.classList.remove('hidden');
                monthContent.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            monthContent.classList.remove('hidden');

            document.getElementById('activeMonthTitle').innerText = activeMonth.name;

            let totalTasks = 0;
            let doneTasks = 0;
            [1, 2, 3, 4].forEach(w => {
                const list = activeMonth.weeks ? activeMonth.weeks[w] || [] : [];
                const activeTasks = list.filter(t => !t.crossed);
                totalTasks += activeTasks.length;
                doneTasks += activeTasks.filter(t => t.done).length;
            });
            const pendingTasks = totalTasks - doneTasks;
            const pct = totalTasks > 0 ? Math.round((doneTasks / totalTasks) * 100) : 0;

            document.getElementById('monthlyPercent').innerText = `${pct}%`;
            document.getElementById('monthlyProgressBar').style.width = `${pct}%`;
            document.getElementById('monthlyDoneCount').innerText = `${doneTasks} done`;
            document.getElementById('monthlyPendingCount').innerText = `${pendingTasks} pending`;

            document.querySelectorAll('.week-tab').forEach(tab => {
                tab.classList.remove('bg-emerald-500', 'text-slate-950', 'shadow-md');
                tab.classList.add('text-slate-400');
            });
            const activeTabBtn = document.getElementById(`tab-${currentTabFilter}`);
            if (activeTabBtn) {
                activeTabBtn.classList.add('bg-emerald-500', 'text-slate-950', 'shadow-md');
                activeTabBtn.classList.remove('text-slate-400');
            }

            const weeksContainer = document.getElementById('weeksContainer');
            weeksContainer.innerHTML = '';

            const weeksToRender = currentTabFilter === 'all' ? [1, 2, 3, 4] : [parseInt(currentTabFilter)];

            weeksToRender.forEach(wNum => {
                const tasks = activeMonth.weeks ? activeMonth.weeks[wNum] || [] : [];
                const activeWeekTasks = tasks.filter(t => !t.crossed);
                const weekDone = activeWeekTasks.filter(t => t.done).length;
                const weekTotal = activeWeekTasks.length;
                const weekPct = weekTotal > 0 ? Math.round((weekDone / weekTotal) * 100) : 0;

                const weekSection = document.createElement('div');
                weekSection.className = 'glass-card rounded-2xl p-5 border border-slate-800/80 transition-all';

                weekSection.innerHTML = `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4 pb-3 border-b border-slate-800">
                        <div class="flex items-center gap-3">
                            <span class="text-sm font-extrabold text-slate-200 tracking-wide uppercase px-2.5 py-1 rounded-lg bg-slate-800 border border-slate-700/60">
                                Week ${wNum}
                            </span>
                            <span class="text-xs text-slate-400 font-medium">${weekDone} of ${weekTotal} completed</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="w-28 sm:w-36 bg-slate-900 rounded-full h-2 overflow-hidden border border-slate-800">
                                <div class="bg-emerald-400 h-2 rounded-full transition-all duration-300" style="width: ${weekPct}%"></div>
                            </div>
                            <span class="text-xs font-bold text-slate-300 min-w-[32px] text-right">${weekPct}%</span>
                            <button onclick="openAddTaskModal(${wNum})" class="ml-2 text-xs text-emerald-400 hover:text-emerald-300 font-semibold flex items-center gap-1 hover:underline">
                                <i data-lucide="plus" class="w-3.5 h-3.5"></i> Add
                            </button>
                        </div>
                    </div>

                    <div class="space-y-2.5" id="week-list-${wNum}">
                        ${
                            tasks.length === 0 
                            ? `<div class="p-4 text-center text-xs text-slate-500 italic rounded-xl border border-dashed border-slate-800/60">No tasks registered for Week ${wNum}</div>` 
                            : ''
                        }
                    </div>
                `;

                weeksContainer.appendChild(weekSection);

                const listEl = weekSection.querySelector(`#week-list-${wNum}`);
                if (tasks.length > 0) {
                    tasks.forEach(task => {
                        const card = document.createElement('div');
                        
                        let themeClass = 'task-pending';
                        if (task.crossed) {
                            themeClass = 'task-crossed';
                        } else if (task.done) {
                            themeClass = 'task-done';
                        }

                        card.className = `task-card ${themeClass} p-3 sm:p-4 rounded-xl flex items-center justify-between gap-3 cursor-pointer group`;
                        card.onclick = (e) => {
                            if (e.target.closest('.action-btn')) return;
                            toggleTaskStatus(wNum, task.id);
                        };

                        let textStyle = "text-red-100 font-medium";
                        if (task.crossed) {
                            textStyle = "text-slate-400 line-through italic";
                        } else if (task.done) {
                            textStyle = "text-emerald-300 font-semibold";
                        }

                        let checkboxStyle = "border-2 border-red-500/80 bg-red-500/10 text-transparent hover:bg-red-500/20";
                        if (task.crossed) {
                            checkboxStyle = "border-2 border-slate-600 bg-slate-800 text-slate-500";
                        } else if (task.done) {
                            checkboxStyle = "bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/30";
                        }

                        card.innerHTML = `
                            <div class="flex items-center gap-3.5 flex-1 min-w-0">
                                <div class="custom-checkbox shrink-0 w-6 h-6 rounded-lg flex items-center justify-center transition-transform group-hover:scale-105 ${checkboxStyle}">
                                    <i data-lucide="${task.crossed ? 'minus' : 'check'}" class="w-4 h-4 stroke-[3]"></i>
                                </div>

                                <span class="text-xs sm:text-sm transition-all duration-200 truncate ${textStyle}">
                                    ${escapeHtml(task.title)}
                                </span>
                            </div>

                            <div class="flex items-center gap-1 opacity-80 group-hover:opacity-100 transition">
                                <button onclick="toggleCrossedTask(${wNum}, '${task.id}')" class="action-btn p-1.5 ${task.crossed ? 'text-amber-400 bg-amber-500/10' : 'text-slate-400 hover:text-amber-400'} hover:bg-slate-800/60 rounded-lg transition" title="${task.crossed ? 'Un-cross task' : 'Cross out task'}">
                                    <i data-lucide="strikethrough" class="w-3.5 h-3.5"></i>
                                </button>
                                <button onclick="openEditTaskModal(${wNum}, '${task.id}')" class="action-btn p-1.5 text-slate-400 hover:text-white hover:bg-slate-800/60 rounded-lg transition" title="Edit Task">
                                    <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
                                </button>
                            </div>
                        `;

                        listEl.appendChild(card);
                    });
                }
            });

            if (window.lucide) lucide.createIcons();
        }

        function toggleTaskStatus(weekNum, taskId) {
            const activeMonth = appData.months.find(m => m.id === appData.activeMonthId);
            if (!activeMonth || !activeMonth.weeks || !activeMonth.weeks[weekNum]) return;

            const task = activeMonth.weeks[weekNum].find(t => t.id === taskId);
            if (task) {
                if (task.crossed) task.crossed = false;
                task.done = !task.done;
                saveToStorage();
                renderActiveMonth();
                renderMonthsList();
            }
        }

        function toggleCrossedTask(weekNum, taskId) {
            const activeMonth = appData.months.find(m => m.id === appData.activeMonthId);
            if (!activeMonth || !activeMonth.weeks || !activeMonth.weeks[weekNum]) return;

            const task = activeMonth.weeks[weekNum].find(t => t.id === taskId);
            if (task) {
                task.crossed = !task.crossed;
                saveToStorage();
                renderActiveMonth();
                renderMonthsList();
            }
        }

        function setActiveWeekTab(tab) {
            currentTabFilter = tab;
            renderActiveMonth();
        }

        function openAddMonthModal() {
            document.getElementById('editMonthId').value = '';
            document.getElementById('monthNameInput').value = '';
            document.getElementById('monthModalTitle').innerText = 'Register New Month';
            document.getElementById('monthTemplateSelect').parentElement.classList.remove('hidden');
            showModal('monthModal');
        }

        function openEditMonthModal() {
            const activeMonth = appData.months.find(m => m.id === appData.activeMonthId);
            if (!activeMonth) return;

            document.getElementById('editMonthId').value = activeMonth.id;
            document.getElementById('monthNameInput').value = activeMonth.name;
            document.getElementById('monthModalTitle').innerText = 'Edit Month Title';
            document.getElementById('monthTemplateSelect').parentElement.classList.add('hidden');
            showModal('monthModal');
        }

        function closeMonthModal() {
            hideModal('monthModal');
        }

        function handleSaveMonth(e) {
            e.preventDefault();
            const editId = document.getElementById('editMonthId').value;
            const nameVal = document.getElementById('monthNameInput').value.trim();
            const template = document.getElementById('monthTemplateSelect').value;

            if (!nameVal) return;

            if (editId) {
                const month = appData.months.find(m => m.id === editId);
                if (month) month.name = nameVal;
            } else {
                const newId = 'm-' + Date.now();
                let newWeeks = { 1: [], 2: [], 3: [], 4: [] };

                if (template === 'sample') {
                    newWeeks = {
                        1: [{ id: 't-' + Date.now() + '1', title: 'Initial setup & week 1 review', done: false, crossed: false }],
                        2: [{ id: 't-' + Date.now() + '2', title: 'Mid-month check-in meeting', done: false, crossed: false }],
                        3: [{ id: 't-' + Date.now() + '3', title: 'Prepare progress summary', done: false, crossed: false }],
                        4: [{ id: 't-' + Date.now() + '4', title: 'Month wrap-up & archiving', done: false, crossed: false }]
                    };
                }

                appData.months.push({
                    id: newId,
                    name: nameVal,
                    weeks: newWeeks
                });
                appData.activeMonthId = newId;
            }

            saveToStorage();
            closeMonthModal();
            renderMonthsList();
            renderActiveMonth();
        }

        function openAddTaskModal(targetWeek = 1) {
            document.getElementById('editTaskId').value = '';
            document.getElementById('taskTitleInput').value = '';
            document.getElementById('taskWeekSelect').value = targetWeek;
            const statusRadios = document.querySelectorAll('input[name="taskStatusRadio"]');
            if (statusRadios.length > 0) statusRadios[0].checked = true;
            document.getElementById('taskModalTitle').innerText = 'Add New Task';
            showModal('taskModal');
        }

        function openEditTaskModal(weekNum, taskId) {
            const activeMonth = appData.months.find(m => m.id === appData.activeMonthId);
            if (!activeMonth || !activeMonth.weeks || !activeMonth.weeks[weekNum]) return;

            const task = activeMonth.weeks[weekNum].find(t => t.id === taskId);
            if (!task) return;

            document.getElementById('editTaskId').value = `${weekNum}||${taskId}`;
            document.getElementById('taskTitleInput').value = task.title;
            document.getElementById('taskWeekSelect').value = weekNum;
            
            const radios = document.querySelectorAll('input[name="taskStatusRadio"]');
            if (radios.length >= 2) {
                if (task.done) radios[1].checked = true;
                else radios[0].checked = true;
            }

            document.getElementById('taskModalTitle').innerText = 'Edit Task';
            showModal('taskModal');
        }

        function closeTaskModal() {
            hideModal('taskModal');
        }

        function handleSaveTask(e) {
            e.preventDefault();
            const activeMonth = appData.months.find(m => m.id === appData.activeMonthId);
            if (!activeMonth) return;

            const editIdCombined = document.getElementById('editTaskId').value;
            const titleVal = document.getElementById('taskTitleInput').value.trim();
            const selectedWeek = parseInt(document.getElementById('taskWeekSelect').value);
            const radioChecked = document.querySelector('input[name="taskStatusRadio"]:checked');
            const isDone = radioChecked ? radioChecked.value === 'true' : false;

            if (!titleVal) return;

            if (!activeMonth.weeks) {
                activeMonth.weeks = { 1: [], 2: [], 3: [], 4: [] };
            }

            if (editIdCombined) {
                const [oldWeekStr, taskId] = editIdCombined.split('||');
                const oldWeek = parseInt(oldWeekStr);

                const existingTask = activeMonth.weeks[oldWeek] ? activeMonth.weeks[oldWeek].find(t => t.id === taskId) : null;
                const isCrossed = existingTask ? !!existingTask.crossed : false;

                if (activeMonth.weeks[oldWeek]) {
                    activeMonth.weeks[oldWeek] = activeMonth.weeks[oldWeek].filter(t => t.id !== taskId);
                }

                if (!activeMonth.weeks[selectedWeek]) activeMonth.weeks[selectedWeek] = [];
                activeMonth.weeks[selectedWeek].push({
                    id: taskId,
                    title: titleVal,
                    done: isDone,
                    crossed: isCrossed
                });
            } else {
                if (!activeMonth.weeks[selectedWeek]) activeMonth.weeks[selectedWeek] = [];
                activeMonth.weeks[selectedWeek].push({
                    id: 't-' + Date.now(),
                    title: titleVal,
                    done: isDone,
                    crossed: false
                });
            }

            saveToStorage();
            closeTaskModal();
            renderActiveMonth();
            renderMonthsList();
        }

        function showModal(id) {
            const modal = document.getElementById(id);
            if (!modal) return;
            const box = modal.querySelector('.id-modal-box');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            if (box) {
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }
        }

        function hideModal(id) {
            const modal = document.getElementById(id);
            if (!modal) return;
            const box = modal.querySelector('.id-modal-box');
            modal.classList.add('opacity-0', 'pointer-events-none');
            if (box) {
                box.classList.remove('scale-100');
                box.classList.add('scale-95');
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
